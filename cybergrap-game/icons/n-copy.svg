<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- High-intensity glow tuned for the brand background -->
    <filter id="neonPop" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Deep base shadow for separation and depth -->
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#043249" flood-opacity="0.6" />
      <!-- Cyan ambient neon glow -->
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Solid Brand Circle Background (#0C87C4) -->
  <circle cx="250" cy="250" r="242" fill="#0C87C4" />
  
  <!-- Outer White Accent Ring -->
  <circle cx="250" cy="250" r="222" stroke="#FFFFFF" stroke-width="7" fill="none" opacity="0.9" />

  <!-- Thick Monoline / Neon "N" -->
  <g filter="url(#neonPop)">
    <!-- Electric Cyan Neon Outer Glow Stroke -->
    <path
      d="M 160 360 L 160 140 L 340 360 L 340 140"
      fill="none"
      stroke="#38bdf8"
      stroke-width="72"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    />

    <!-- Thick Pure White High-Contrast Core -->
    <path
      d="M 160 360 L 160 140 L 340 360 L 340 140"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="48"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
