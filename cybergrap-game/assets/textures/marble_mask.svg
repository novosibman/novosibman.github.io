<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
    <defs>
        <!-- Marble Vein Mask for opacity modulation and fissure highlights -->
        <mask id="marble-mask">
            <!-- White base: full transmission -->
            <rect width="160" height="160" fill="#ffffff"/>
            
            <!-- Veins masking with subtle variation -->
            <path d="M-20,40 Q40,10 90,50 T180,30" fill="none" stroke="#666666" stroke-width="14" stroke-linecap="round"/>
            <path d="M-10,120 Q50,90 100,130 T190,110" fill="none" stroke="#555555" stroke-width="18" stroke-linecap="round"/>

            <path d="M-10,30 Q30,15 75,45 T170,25" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
            <path d="M45,30 Q60,60 85,75 T130,95" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
            <path d="M85,75 Q110,65 145,70" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round"/>

            <path d="M-20,110 Q40,85 95,120 T180,105" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
            <path d="M60,100 Q80,135 110,145" fill="none" stroke="#333333" stroke-width="1.4" stroke-linecap="round"/>
        </mask>
    </defs>
    <rect width="160" height="160" fill="#000000" mask="url(#marble-mask)"/>
</svg>
