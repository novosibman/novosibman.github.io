<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
    <defs>
        <!-- Seamless Tileable Marble Texture Pattern -->
        <pattern id="marble-pattern" width="160" height="160" patternUnits="userSpaceOnUse">
            <!-- Calcite Base -->
            <rect width="160" height="160" fill="#1e293b"/>
            
            <!-- Soft Metamorphic Swirls / Veining Wash -->
            <path d="M-20,40 Q40,10 90,50 T180,30" fill="none" stroke="#475569" stroke-width="14" opacity="0.3" stroke-linecap="round"/>
            <path d="M-10,120 Q50,90 100,130 T190,110" fill="none" stroke="#334155" stroke-width="18" opacity="0.35" stroke-linecap="round"/>

            <!-- Primary Mineral Veins (Calcite & Quartz Fissures) -->
            <path d="M-10,30 Q30,15 75,45 T170,25" fill="none" stroke="#94a3b8" stroke-width="2.8" opacity="0.65" stroke-linecap="round"/>
            <path d="M-10,29 Q30,14 75,44 T170,24" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85" stroke-linecap="round"/>
            
            <!-- Branching Secondary Veins -->
            <path d="M45,30 Q60,60 85,75 T130,95" fill="none" stroke="#cbd5e1" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
            <path d="M46,31 Q60,60 85,75 T130,95" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.75" stroke-linecap="round"/>

            <path d="M85,75 Q110,65 145,70" fill="none" stroke="#94a3b8" stroke-width="1.4" opacity="0.55" stroke-linecap="round"/>

            <!-- Lower Diagonal Vein System -->
            <path d="M-20,110 Q40,85 95,120 T180,105" fill="none" stroke="#cbd5e1" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>
            <path d="M-20,109 Q40,84 95,119 T180,104" fill="none" stroke="#ffffff" stroke-width="1.0" opacity="0.8" stroke-linecap="round"/>

            <!-- Subtle Micro-Fissures -->
            <path d="M60,100 Q80,135 110,145" fill="none" stroke="#94a3b8" stroke-width="1.1" opacity="0.5"/>
            <path d="M10,70 Q25,85 30,110" fill="none" stroke="#64748b" stroke-width="1.3" opacity="0.45"/>
            <path d="M120,20 Q135,40 155,50" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.45"/>

            <!-- Fine Crystalline Vein Sheen -->
            <circle cx="75" cy="45" r="1.5" fill="#ffffff" opacity="0.9"/>
            <circle cx="85" cy="75" r="1.3" fill="#ffffff" opacity="0.85"/>
            <circle cx="95" cy="120" r="1.4" fill="#ffffff" opacity="0.9"/>
        </pattern>
    </defs>
    <!-- Preview rectangle demonstrating pattern -->
    <rect width="160" height="160" fill="url(#marble-pattern)"/>
</svg>
