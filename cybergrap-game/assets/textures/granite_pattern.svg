            <polygon points="112,46 118,52 114,60" fill="#94a3b8" opacity="0.45"/>
            <circle cx="16" cy="84" r="3.5" fill="#cbd5e1" opacity="0.5"/>
            <polygon points="38,82 46,78 44,90" fill="#e2e8f0" opacity="0.6"/>
