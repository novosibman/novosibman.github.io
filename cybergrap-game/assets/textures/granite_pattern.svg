            <!-- Base Stone Granular Matrix -->
            <rect width="120" height="120" fill="#334155"/>
            <!-- Feldspar Crystals (light pinkish-grey) -->
            <circle cx="12" cy="18" r="2.5" fill="#94a3b8" opacity="0.6"/>
            <polygon points="28,14 34,10 32,20" fill="#cbd5e1" opacity="0.5"/>
            <circle cx="54" cy="22" r="3" fill="#e2e8f0" opacity="0.45"/>
