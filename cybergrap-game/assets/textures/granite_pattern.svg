            <polygon points="86,86 92,78 96,92" fill="#cbd5e1" opacity="0.55"/>
            <circle cx="108" cy="98" r="3.1" fill="#e2e8f0" opacity="0.45"/>

            <!-- Biotite & Hornblende Dark Mica Flecks -->
            <circle cx="8" cy="38" r="1.5" fill="#0f172a" opacity="0.85"/>
            <polygon points="22,26 25,23 24,28" fill="#020617" opacity="0.9"/>
            <circle cx="48" cy="12" r="1.8" fill="#0f172a" opacity="0.8"/>
            <circle cx="62" cy="34" r="1.4" fill="#020617" opacity="0.9"/>
            <polygon points="88,24 92,21 90,27" fill="#0f172a" opacity="0.85"/>
            <circle cx="114" cy="16" r="1.6" fill="#020617" opacity="0.8"/>
            <polygon points="32,68 36,65 34,71" fill="#0f172a" opacity="0.9"/>
            <circle cx="56" cy="74" r="1.7" fill="#020617" opacity="0.85"/>
            <polygon points="80,66 84,62 82,70" fill="#0f172a" opacity="0.9"/>
            <circle cx="104" cy="76" r="1.5" fill="#020617" opacity="0.85"/>
            <polygon points="8,106 12,102 11,110" fill="#0f172a" opacity="0.9"/>
            <circle cx="30,114" r="1.6" fill="#020617" opacity="0.85"/>
            <polygon points="52,104 56,100 54,108" fill="#0f172a" opacity="0.9"/>
            <circle cx="78,112" r="1.8" fill="#020617" opacity="0.85"/>
            <polygon points="98,108 102,104 100,112" fill="#020617" opacity="0.9"/>

            <!-- Quartz Crystalline Micro-Specks (Sparkles) -->
            <circle cx="20" cy="8" r="0.9" fill="#ffffff" opacity="0.8"/>
            <circle cx="44" cy="36" r="0.8" fill="#ffffff" opacity="0.75"/>
            <circle cx="70" cy="20" r="1.0" fill="#ffffff" opacity="0.85"/>
            <circle cx="96" cy="40" r="0.9" fill="#ffffff" opacity="0.7"/>
            <circle cx="14" cy="62" r="0.8" fill="#ffffff" opacity="0.8"/>
            <circle cx="50" cy="88" r="1.1" fill="#ffffff" opacity="0.85"/>
            <circle cx="74" cy="72" r="0.9" fill="#ffffff" opacity="0.75"/>
            <circle cx="116" cy="84" r="0.8" fill="#ffffff" opacity="0.8"/>
            <circle cx="26" cy="98" r="1.0" fill="#ffffff" opacity="0.85"/>
            <circle cx="86" cy="116" r="0.9" fill="#ffffff" opacity="0.75"/>
