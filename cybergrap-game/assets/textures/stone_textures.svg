<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <defs>
        <!-- 1. Granite Texture Pattern -->
        <pattern id="pattern-granite" width="120" height="120" patternUnits="userSpaceOnUse">
            <rect width="120" height="120" fill="#334155"/>
            <!-- Feldspar Crystals -->
            <circle cx="12" cy="18" r="2.5" fill="#94a3b8" opacity="0.6"/>
            <polygon points="28,14 34,10 32,20" fill="#cbd5e1" opacity="0.5"/>
            <circle cx="54" cy="22" r="3" fill="#e2e8f0" opacity="0.45"/>
            <polygon points="76,8 84,12 80,18" fill="#94a3b8" opacity="0.55"/>
            <circle cx="102" cy="28" r="2" fill="#cbd5e1" opacity="0.65"/>
            <polygon points="18,48 24,42 22,54" fill="#e2e8f0" opacity="0.4"/>
            <circle cx="42" cy="56" r="3.2" fill="#94a3b8" opacity="0.5"/>
            <polygon points="68,44 74,38 72,50" fill="#cbd5e1" opacity="0.6"/>
            <circle cx="92" cy="58" r="2.8" fill="#e2e8f0" opacity="0.55"/>
            <circle cx="16" cy="84" r="3.5" fill="#cbd5e1" opacity="0.5"/>
            <polygon points="38,82 46,78 44,90" fill="#e2e8f0" opacity="0.6"/>
            <circle cx="64" cy="92" r="2.4" fill="#94a3b8" opacity="0.65"/>
            <polygon points="86,86 92,78 96,92" fill="#cbd5e1" opacity="0.55"/>
            <circle cx="108" cy="98" r="3.1" fill="#e2e8f0" opacity="0.45"/>

            <!-- Biotite Dark Mica Flecks -->
            <circle cx="8" cy="38" r="1.5" fill="#0f172a" opacity="0.85"/>
            <polygon points="22,26 25,23 24,28" fill="#020617" opacity="0.9"/>
            <circle cx="48" cy="12" r="1.8" fill="#0f172a" opacity="0.8"/>
            <circle cx="62" cy="34" r="1.4" fill="#020617" opacity="0.9"/>
            <polygon points="88,24 92,21 90,27" fill="#0f172a" opacity="0.85"/>
            <circle cx="114" cy="16" r="1.6" fill="#020617" opacity="0.8"/>
            <polygon points="32,68 36,65 34,71" fill="#0f172a" opacity="0.9"/>
            <circle cx="56" cy="74" r="1.7" fill="#020617" opacity="0.85"/>
            <polygon points="80,66 84,62 82,70" fill="#0f172a" opacity="0.9"/>
            <circle cx="104" cy="76" r="1.5" fill="#020617" opacity="0.85"/>
            <circle cx="30,114" r="1.6" fill="#020617" opacity="0.85"/>
            <circle cx="78,112" r="1.8" fill="#020617" opacity="0.85"/>

            <!-- Quartz Sparkles -->
            <circle cx="20" cy="8" r="0.9" fill="#ffffff" opacity="0.85"/>
            <circle cx="70" cy="20" r="1.0" fill="#ffffff" opacity="0.9"/>
            <circle cx="96" cy="40" r="0.9" fill="#ffffff" opacity="0.8"/>
            <circle cx="50" cy="88" r="1.1" fill="#ffffff" opacity="0.9"/>
            <circle cx="116" cy="84" r="0.8" fill="#ffffff" opacity="0.85"/>
        </pattern>

        <!-- 2. Marble Texture Pattern -->
        <pattern id="pattern-marble" width="160" height="160" patternUnits="userSpaceOnUse">
            <rect width="160" height="160" fill="#1e293b"/>
            <!-- Primary and secondary veins -->
            <path d="M-10,30 Q30,15 75,45 T170,25" fill="none" stroke="#94a3b8" stroke-width="2.8" opacity="0.65" stroke-linecap="round"/>
            <path d="M-10,29 Q30,14 75,44 T170,24" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85" stroke-linecap="round"/>
            <path d="M45,30 Q60,60 85,75 T130,95" fill="none" stroke="#cbd5e1" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
            <path d="M46,31 Q60,60 85,75 T130,95" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.75" stroke-linecap="round"/>
            <path d="M85,75 Q110,65 145,70" fill="none" stroke="#94a3b8" stroke-width="1.4" opacity="0.55" stroke-linecap="round"/>
            <path d="M-20,110 Q40,85 95,120 T180,105" fill="none" stroke="#cbd5e1" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>
            <path d="M-20,109 Q40,84 95,119 T180,104" fill="none" stroke="#ffffff" stroke-width="1.0" opacity="0.8" stroke-linecap="round"/>
            <circle cx="75" cy="45" r="1.5" fill="#ffffff" opacity="0.9"/>
            <circle cx="95" cy="120" r="1.4" fill="#ffffff" opacity="0.9"/>
        </pattern>

        <!-- Granite Mask -->
        <mask id="mask-granite">
            <rect width="120" height="120" fill="#ffffff"/>
            <circle cx="12" cy="18" r="2.5" fill="#333333"/>
            <circle cx="54" cy="22" r="3" fill="#222222"/>
            <polygon points="68,44 74,38 72,50" fill="#111111"/>
            <circle cx="16" cy="84" r="3.5" fill="#333333"/>
            <circle cx="8" cy="38" r="1.5" fill="#000000"/>
            <circle cx="48" cy="12" r="1.8" fill="#000000"/>
            <circle cx="62" cy="34" r="1.4" fill="#000000"/>
        </mask>

        <!-- Marble Mask -->
        <mask id="mask-marble">
            <rect width="160" height="160" fill="#ffffff"/>
            <path d="M-10,30 Q30,15 75,45 T170,25" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
            <path d="M45,30 Q60,60 85,75 T130,95" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
            <path d="M-20,110 Q40,85 95,120 T180,105" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
        </mask>
    </defs>
</svg>
