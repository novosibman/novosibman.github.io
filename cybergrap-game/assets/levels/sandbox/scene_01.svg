<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="100%" stopColor="#db2777" />
    </linearGradient>
  </defs>

  <!-- Sandbox Mode Playground Scene with diverse block types: breakables (hp 1,2,3), textured granite/marble obstacles, and stars -->

  <!-- Top Wall Bumper / Marble Arch Shield -->
  <rect id="obs_top_marble" x="180" y="40" width="280" height="18" rx="4" fill="#a4748b" stroke="#f8fafc" stroke-width="2" data-texture="marble" data-restitution="1.0" />

  <!-- Lateral Granite Bumpers / Rebound Deflectors -->
  <polygon id="bumper_left_granite" points="40,110 90,140 40,170" fill="#934195" stroke="#94a3b8" stroke-width="2" data-texture="granite" data-restitution="1.2" />
  <polygon id="bumper_right_granite" points="600,110 550,140 600,170" fill="#934195" stroke="#94a3b8" stroke-width="2" data-texture="granite" data-restitution="1.2" />

  <!-- Stars (3 Stars with distinct vibrant two-tone fills & strokes) -->
  <!-- Star 1: Central Golden/Crimson Star -->
  <polygon id="star_1" points="320,115 326,132 344,133 330,144 335,161 320,150 305,161 310,144 296,133 314,132" fill="#ffee00" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Star 2: Left Cyan/Pink Star -->
  <polygon id="star_2" points="160,115 166,132 184,133 170,144 175,161 160,150 145,161 150,144 136,133 154,132" fill="#38bdf8" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Star 3: Right Violet/Amber Star -->
  <polygon id="star_3" points="480,115 486,132 504,133 490,144 495,161 480,150 465,161 470,144 456,133 474,132" fill="#c084fc" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Layer 1: Breakable HP=1 Glass Blocks (Light cyan translucent) -->
  <rect id="br_glass_1" class="breakable" data-hp="1" x="120" y="190" width="70" height="22" rx="4" fill="rgba(56, 189, 248, 0.45)" stroke="#38bdf8" stroke-width="1.5" />
  <rect id="br_glass_2" class="breakable" data-hp="1" x="200" y="190" width="70" height="22" rx="4" fill="rgba(56, 189, 248, 0.45)" stroke="#38bdf8" stroke-width="1.5" />
  <rect id="br_glass_3" class="breakable" data-hp="1" x="285" y="190" width="70" height="22" rx="4" fill="rgba(56, 189, 248, 0.45)" stroke="#38bdf8" stroke-width="1.5" />
  <rect id="br_glass_4" class="breakable" data-hp="1" x="370" y="190" width="70" height="22" rx="4" fill="rgba(56, 189, 248, 0.45)" stroke="#38bdf8" stroke-width="1.5" />
  <rect id="br_glass_5" class="breakable" data-hp="1" x="450" y="190" width="70" height="22" rx="4" fill="rgba(56, 189, 248, 0.45)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Indestructible Marble Core Column Dividers -->
  <circle id="obs_circle_granite_1" cx="100" cy="250" r="18" fill="#475569" stroke="#94a3b8" stroke-width="2" data-texture="granite" />
  <circle id="obs_circle_granite_2" cx="540" cy="250" r="18" fill="#475569" stroke="#94a3b8" stroke-width="2" data-texture="granite" />

  <!-- Layer 2: Breakable HP=2 Medium Armor Blocks (Vibrant Amber/Orange) -->
  <rect id="br_med_1" class="breakable" data-hp="2" x="150" y="230" width="65" height="24" rx="4" fill="#f59e0b" stroke="#fcd34d" stroke-width="2" />
  <rect id="br_med_2" class="breakable" data-hp="2" x="240" y="230" width="65" height="24" rx="4" fill="#f59e0b" stroke="#fcd34d" stroke-width="2" />
  <rect id="br_med_3" class="breakable" data-hp="2" x="335" y="230" width="65" height="24" rx="4" fill="#f59e0b" stroke="#fcd34d" stroke-width="2" />
  <rect id="br_med_4" class="breakable" data-hp="2" x="425" y="230" width="65" height="24" rx="4" fill="#f59e0b" stroke="#fcd34d" stroke-width="2" />

  <!-- Layer 3: Central Indestructible Granite Pillar Platform -->
  <rect id="obs_pillar_granite" x="270" y="275" width="100" height="18" rx="3" fill="#334155" stroke="#cbd5e1" stroke-width="2" data-texture="granite" />

  <!-- Layer 4: Breakable HP=3 Heavy Armored Blocks (Magenta/Crimson) -->
  <rect id="br_heavy_1" class="breakable" data-hp="3" x="160" y="275" width="90" height="26" rx="4" fill="#e11d48" stroke="#fda4af" stroke-width="2" />
  <rect id="br_heavy_2" class="breakable" data-hp="3" x="390" y="275" width="90" height="26" rx="4" fill="#e11d48" stroke="#fda4af" stroke-width="2" />

  <!-- Bottom Deflector Bumper Wedges (Marble Texture) -->
  <polygon id="bumper_bottom_left" points="110,330 180,310 180,330" fill="#c7c5a9" stroke="#e2e8f0" stroke-width="2" data-texture="marble" data-restitution="1.15" />
  <polygon id="bumper_bottom_right" points="530,330 460,310 460,330" fill="#c7c5a9" stroke="#e2e8f0" stroke-width="2" data-texture="marble" data-restitution="1.15" />
</svg>


