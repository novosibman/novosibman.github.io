<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
    <defs>
        <linearGradient id="crawlerSkin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#026d6d"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0f766e"/>
        </linearGradient>
    </defs>

    <!-- Crawler Track Diagonal Treads & Wheels -->
    <rect x="20" y="60" width="120" height="12" rx="4" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="28" y1="60" x2="34" y2="72" stroke="#f59e0b" stroke-width="2"/>
    <line x1="44" y1="60" x2="50" y2="72" stroke="#f59e0b" stroke-width="2"/>
    <line x1="60" y1="60" x2="66" y2="72" stroke="#f59e0b" stroke-width="2"/>
    <line x1="76" y1="60" x2="82" y2="72" stroke="#f59e0b" stroke-width="2"/>
    <line x1="92" y1="60" x2="98" y2="72" stroke="#f59e0b" stroke-width="2"/>
    <line x1="108" y1="60" x2="114" y2="72" stroke="#f59e0b" stroke-width="2"/>
    <line x1="124" y1="60" x2="130" y2="72" stroke="#f59e0b" stroke-width="2"/>

    <!-- Thruster engines -->
    <path id="left_engine" d="M 14 44 L 4 48 L 14 52 Z" fill="#026d6d" stroke="#00f2fe" stroke-width="1"/>
    <path id="right_engine" d="M 146 44 L 156 48 L 146 52 Z" fill="#026d6d" stroke="#00f2fe" stroke-width="1"/>

    <!-- Platform body -->
    <rect id="platform_4" x="14" y="37" width="132" height="25" rx="6" fill="url(#crawlerSkin)" stroke="#00f2fe" stroke-width="2.5"/>
    <line x1="18" y1="41" x2="142" y2="41" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 3"/>

    <!-- Ammo indicators: Cart 4 has exactly 4 balls in magazine -->
    <circle id="ball_1" cx="36" cy="50" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_2" cx="48" cy="50" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_3" cx="60" cy="50" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_4" cx="72" cy="50" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Stylized Sitting Cyber-Cat Commander (Enlarged, all parts visible) -->
    <g id="cyber_cat" transform="translate(26, 2)">
        <!-- 1. Upward curling tail with tech ring -->
        <path d="M 40 33 C 48 30 54 19 50 10 C 46 3 38 4 36 8 C 34 12 38 17 42 17" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="42" cy="17" r="3" fill="#facc15" stroke="#ffffff" stroke-width="1.2"/>

        <!-- 2. Sitting cat body and hind haunch sitting on deck -->
        <path d="M 10 36 L 10 24 C 10 16 16 13 22 13 C 28 13 34 16 35 24 C 37 28 41 31 43 36 Z" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
        <ellipse cx="34" cy="30" rx="8" ry="5.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>

        <!-- 3. Front paws resting on cart deck edge -->
        <ellipse cx="14" cy="35" rx="5" ry="2.8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
        <ellipse cx="24" cy="35" rx="5" ry="2.8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>

        <!-- 4. Cat ears with armored plates -->
        <polygon points="10,12 15,-5 20,9" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
        <polygon points="12,9 15,0 19,8" fill="#38bdf8"/>
        <polygon points="23,9 28,-5 33,12" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
        <polygon points="25,8 28,0 31,9" fill="#38bdf8"/>

        <!-- 5. Enlarged Cat head & Heavy VR visor -->
        <circle id="cat_head" cx="22" cy="14" r="16" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5"/>
        <rect x="10" y="10" width="24" height="8" rx="4" fill="#00f2fe" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="12" y1="14" x2="32" y2="14" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>

        <!-- 6. Whiskers -->
        <line x1="7" y1="17" x2="-3" y2="15" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7" y1="21" x2="-2" y2="23" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="17" x2="47" y2="15" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="21" x2="46" y2="23" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 7. Cyber Collar with commander badge -->
        <path d="M 14 26 C 18 29 26 29 30 26" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="28.5" r="2.5" fill="#facc15" stroke="#ffffff" stroke-width="1"/>
    </g>

    <g id="gun_group" transform="translate(112, 40) rotate(-90)">
        <path id="gun_1" d="M -7 -6 L 24 -6 L 26 -8 L 30 -8 L 30 8 L 26 8 L 24 6 L -7 6 Z" fill="#0f766e" stroke="#00f2fe" stroke-width="2"/>
        <circle id="shot_1" cx="30" cy="0" r="3" fill="#00f2fe"/>
        <circle id="axis_1" cx="0" cy="0" r="4" fill="#00f2fe"/>
    </g>
</svg>
