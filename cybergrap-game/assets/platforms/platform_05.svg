<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
    <defs>
        <linearGradient id="planeFuselageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="45%" stop-color="#1e293b"/>
            <stop offset="85%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="planeWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7"/>
            <stop offset="60%" stop-color="#0369a1"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="planeCatBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
    </defs>

    <!-- Upper/Far Swept-Back Wing (as seen in jet silhouette) -->
    <polygon points="90,36 66,22 72,21 102,36" fill="url(#planeWingGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="66" cy="22" r="2.2" fill="#ef4444"/> <!-- Red port wingtip navigation light -->

    <!-- Tail Horizontal Stabilizer -->
    <polygon points="32,47 16,52 20,54 36,49" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Flying Jet Plane Platform without wheels (hovers/flies smoothly) -->

    <!-- Jet Turbine Engines (tips at X=4 and X=156, Y=47) -->
    <path id="left_engine" d="M 14 43 L 4 47 L 14 51 Z" fill="#f97316" stroke="#fbbf24" stroke-width="1"/>
    <path id="right_engine" d="M 146 43 L 156 47 L 146 51 Z" fill="#f97316" stroke="#fbbf24" stroke-width="1"/>

    <!-- Airplane Platform Body: Sleek Commercial Airliner Silhouette matching image.png -->
    <!-- Fuselage with swept-back tailfin, horizontal stabilizer, and aerodynamic bullet nose -->
    <path id="platform_5" d="M 22 47 L 30 38 L 18 16 L 27 16 L 38 36 L 124 36 C 136 36 152 41 152 47 C 152 53 136 58 124 58 L 38 58 L 22 47 Z" fill="url(#planeFuselageGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Fuselage aerodynamic speed stripes -->
    <line x1="38" y1="41" x2="132" y2="41" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.8"/>
    <line x1="42" y1="52" x2="136" y2="52" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

    <!-- Lower/Main Swept-Back Jet Wing (swept backwards at ~30 deg angle as in image.png) -->
    <polygon points="98,54 58,72 66,73 112,56" fill="url(#planeWingGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="58" cy="72" r="2.2" fill="#10b981"/> <!-- Green starboard wingtip navigation light -->

    <!-- Under-wing Streamlined Jet Engine Nacelle -->
    <rect x="74" y="55" width="24" height="8" rx="3.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="98" cy="59" rx="2" ry="3.5" fill="#38bdf8"/> <!-- Turbine air intake -->
    <ellipse cx="74" cy="59" rx="1.5" ry="3" fill="#f97316"/> <!-- Engine exhaust core -->

    <!-- 4 Passenger Cabin Windows / Plasma Ammo Indicators in Magazine -->
    <circle id="ball_1" cx="72" cy="46" r="4.5" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_2" cx="84" cy="46" r="4.5" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_3" cx="96" cy="46" r="4.5" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_4" cx="108" cy="46" r="4.5" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Stylized Pilot Cyber-Cat in Airplane Cockpit (Enlarged, all parts visible) -->
    <g id="cyber_cat" transform="translate(32, 2)">
        <!-- 1. Upward curling tail with glowing plasma tip ring -->
        <path d="M 38 33 C 46 30 52 19 48 10 C 44 3 36 4 34 8 C 32 12 36 17 40 17" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="40" cy="17" r="3" fill="#f97316" stroke="#ffffff" stroke-width="1"/>

        <!-- 2. Sitting cat body and hind haunch sitting on cockpit deck -->
        <path d="M 10 36 L 10 24 C 10 16 16 13 22 13 C 28 13 34 16 35 24 C 37 28 41 31 43 36 Z" fill="url(#planeCatBodyGrad)" stroke="#38bdf8" stroke-width="2"/>
        <ellipse cx="34" cy="30" rx="8" ry="5.5" fill="#1e293b" stroke="#0284c7" stroke-width="1.8"/>

        <!-- 3. Front paws resting on cockpit deck edge -->
        <ellipse cx="14" cy="35" rx="5" ry="2.8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <ellipse cx="24" cy="35" rx="5" ry="2.8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

        <!-- 4. Pilot aviator cat ears standing tall -->
        <polygon points="10,12 15,-6 20,9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <polygon points="12,9 15,-1 19,8" fill="#f97316"/>
        <polygon points="23,9 29,-6 34,12" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <polygon points="25,8 29,-1 32,9" fill="#f97316"/>

        <!-- 5. Enlarged Cat head & Pilot helmet contour -->
        <circle id="cat_head" cx="22" cy="14" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>

        <!-- 6. Glowing aviator cyber visor -->
        <rect x="10" y="10" width="24" height="8" rx="4" fill="#f97316" stroke="#fbbf24" stroke-width="1.2"/>
        <line x1="12" y1="14" x2="32" y2="14" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>

        <!-- 7. Prominent Whiskers -->
        <line x1="7" y1="17" x2="-3" y2="15" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7" y1="21" x2="-2" y2="23" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="17" x2="47" y2="15" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="21" x2="46" y2="23" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 8. Glowing Pilot Collar & Tag -->
        <path d="M 14 26 C 18 29 26 29 30 26" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="28.5" r="2.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Forward Plasma Laser Cannon mounted at wing root -->
    <g id="gun_group" transform="translate(122, 42) rotate(-90)">
        <path id="gun_1" d="M -7 -6 L 24 -6 L 26 -8 L 30 -8 L 30 8 L 26 8 L 24 6 L -7 6 Z" fill="#0284c7" stroke="#f97316" stroke-width="2"/>
        <circle id="shot_1" cx="30" cy="0" r="3" fill="#00f2fe"/>
        <circle id="axis_1" cx="0" cy="0" r="4" fill="#00f2fe"/>
    </g>
</svg>
