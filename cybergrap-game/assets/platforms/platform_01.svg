<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
    <defs>
        <linearGradient id="neonCyanSkin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
        </linearGradient>
        <linearGradient id="catBodyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <linearGradient id="cyberWheel1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
    </defs>

    <!-- Wheels (rotating when moving along X) -->
    <circle id="wheel_0" cx="28" cy="65" r="12" fill="url(#cyberWheel1)" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="28" cy="65" r="5" fill="#00f2fe" opacity="0.8"/>
    <circle id="wheel_1" cx="132" cy="65" r="12" fill="url(#cyberWheel1)" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="132" cy="65" r="5" fill="#00f2fe" opacity="0.8"/>

    <!-- Thruster engines (left and right) for particle emission: tips at X=4 and X=156, Y=48 -->
    <path id="left_engine" d="M 14 44 L 4 48 L 14 52 Z" fill="#38bdf8" stroke="#00f2fe" stroke-width="1"/>
    <path id="right_engine" d="M 146 44 L 156 48 L 146 52 Z" fill="#38bdf8" stroke="#00f2fe" stroke-width="1"/>

    <!-- Platform body: Slightly larger & diverse (130px wide, 25px high) -->
    <rect id="platform_1" x="15" y="37" width="130" height="25" rx="7" fill="url(#neonCyanSkin)" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 22 41 L 138 41" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.6"/>
    <!-- Cyber bumper accents -->
    <rect x="18" y="47" width="10" height="10" rx="2" fill="#0f172a" stroke="#00f2fe" stroke-width="1"/>
    <rect x="132" y="47" width="10" height="10" rx="2" fill="#0f172a" stroke="#00f2fe" stroke-width="1"/>

    <!-- Ammo indicators: Cart 1 has exactly 2 balls in magazine -->
    <circle id="ball_1" cx="44" cy="50" r="5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_2" cx="58" cy="50" r="5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Stylized Sitting Cyber-Cat on Cart Deck (Enlarged, all parts visible) -->
    <g id="cyber_cat" transform="translate(26, 2)">
        <!-- 1. Upward curling tail with glowing cyber tip ring (drawn behind body) -->
        <path d="M 40 33 C 48 30 54 19 50 10 C 46 3 38 4 36 8 C 34 12 38 17 42 17" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="42" cy="17" r="3" fill="#00f2fe" stroke="#ffffff" stroke-width="1"/>

        <!-- 2. Sitting cat body: arched back and rounded hind haunch sitting on deck -->
        <path d="M 10 36 L 10 24 C 10 16 16 13 22 13 C 28 13 34 16 35 24 C 37 28 41 31 43 36 Z" fill="url(#catBodyGrad1)" stroke="#00f2fe" stroke-width="2"/>
        <ellipse cx="34" cy="30" rx="8" ry="5.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>

        <!-- 3. Front paws resting on cart deck edge -->
        <ellipse cx="14" cy="35" rx="5" ry="2.8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
        <ellipse cx="24" cy="35" rx="5" ry="2.8" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>

        <!-- 4. Cat ears standing tall with pink inner ear -->
        <polygon points="10,12 15,-6 20,9" fill="#fb7185" stroke="#f43f5e" stroke-width="1.5"/>
        <polygon points="12,9 15,-1 19,8" fill="#ffe4e6"/>
        <polygon points="23,9 29,-6 34,12" fill="#fb7185" stroke="#f43f5e" stroke-width="1.5"/>
        <polygon points="25,8 29,-1 32,9" fill="#ffe4e6"/>

        <!-- 5. Enlarged Cat head & VR visor -->
        <circle id="cat_head" cx="22" cy="14" r="16" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5"/>

        <!-- 6. Glowing neon cyber visor -->
        <rect x="10" y="10" width="24" height="8" rx="4" fill="#00f2fe" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="12" y1="14" x2="32" y2="14" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>

        <!-- 7. Cute cat whiskers -->
        <line x1="7" y1="17" x2="-3" y2="15" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7" y1="21" x2="-2" y2="23" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="17" x2="47" y2="15" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="21" x2="46" y2="23" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 8. Glowing Cyber Collar with medallion -->
        <path d="M 14 26 C 18 29 26 29 30 26" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="28.5" r="2.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Rotating Cannon barrel sprite (path#gun_1) -->
    <g id="gun_group" transform="translate(108, 40) rotate(-90)">
        <path id="gun_1" d="M -7 -6 L 24 -6 L 26 -8 L 30 -8 L 30 8 L 26 8 L 24 6 L -7 6 Z" fill="#0284c7" stroke="#00f2fe" stroke-width="2"/>
        <!-- Muzzle spawn point (circle#shot_1) -->
        <circle id="shot_1" cx="30" cy="0" r="3" fill="#00f2fe"/>
        <!-- Gun rotation axis (circle#axis_1) -->
        <circle id="axis_1" cx="0" cy="0" r="4" fill="#00f2fe"/>
    </g>
</svg>
