<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
    <defs>
        <linearGradient id="neonGoldSkin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="60%" stop-color="#d97706"/>
            <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
        <linearGradient id="cyberWheel2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#27272a"/>
            <stop offset="100%" stop-color="#09090b"/>
        </linearGradient>
    </defs>

    <!-- 3 Wheels Variant: Left (26), Middle (80), Right (134) -->
    <circle id="wheel_0" cx="26" cy="65" r="11" fill="url(#cyberWheel2)" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="26" cy="65" r="4.5" fill="#facc15" opacity="0.8"/>

    <circle id="wheel_1" cx="80" cy="65" r="11" fill="url(#cyberWheel2)" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="80" cy="65" r="4.5" fill="#facc15" opacity="0.8"/>

    <circle id="wheel_2" cx="134" cy="65" r="11" fill="url(#cyberWheel2)" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="134" cy="65" r="4.5" fill="#facc15" opacity="0.8"/>

    <!-- Thruster engines (left and right) -->
    <path id="left_engine" d="M 14 44 L 4 48 L 14 52 Z" fill="#ef4444" stroke="#f59e0b" stroke-width="1"/>
    <path id="right_engine" d="M 146 44 L 156 48 L 146 52 Z" fill="#ef4444" stroke="#f59e0b" stroke-width="1"/>

    <!-- Platform body: 136px wide with golden cyber armor -->
    <rect id="platform_2" x="12" y="37" width="136" height="25" rx="7" fill="url(#neonGoldSkin)" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M 18 41 L 142 41" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.7"/>

    <!-- Ammo indicators: Cart 2 has exactly 3 balls in magazine -->
    <circle id="ball_1" cx="40" cy="50" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_2" cx="52" cy="50" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
    <circle id="ball_3" cx="64" cy="50" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Stylized Sitting Cyber-Cat with Golden Visor & Crown (Enlarged, all parts visible) -->
    <g id="cyber_cat" transform="translate(28, 2)">
        <!-- 1. Upward curling tail with golden cyber emitter ring -->
        <path d="M 40 33 C 48 30 54 19 50 10 C 46 3 38 4 36 8 C 34 12 38 17 42 17" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="42" cy="17" r="3" fill="#ef4444" stroke="#fbbf24" stroke-width="1.2"/>

        <!-- 2. Sitting cat body and hind haunch sitting on deck -->
        <path d="M 10 36 L 10 24 C 10 16 16 13 22 13 C 28 13 34 16 35 24 C 37 28 41 31 43 36 Z" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
        <ellipse cx="34" cy="30" rx="8" ry="5.5" fill="#27272a" stroke="#fbbf24" stroke-width="1.8"/>

        <!-- 3. Front paws resting on cart deck edge -->
        <ellipse cx="14" cy="35" rx="5" ry="2.8" fill="#27272a" stroke="#f59e0b" stroke-width="1.5"/>
        <ellipse cx="24" cy="35" rx="5" ry="2.8" fill="#27272a" stroke="#f59e0b" stroke-width="1.5"/>

        <!-- 4. Cat ears standing tall -->
        <polygon points="10,12 15,-5 20,9" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
        <polygon points="12,9 15,0 19,8" fill="#fef08a"/>
        <polygon points="23,9 28,-5 33,12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
        <polygon points="25,8 28,0 31,9" fill="#fef08a"/>

        <!-- 5. Golden Crown Accent -->
        <polygon points="16,3 19,-5 22,-1 25,-5 28,3" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>

        <!-- 6. Enlarged Cat head & Visor -->
        <circle id="cat_head" cx="22" cy="14" r="16" fill="#18181b" stroke="#f59e0b" stroke-width="2.5"/>
        <rect x="10" y="10" width="24" height="8" rx="4" fill="#ef4444" stroke="#fbbf24" stroke-width="1.5"/>
        <line x1="12" y1="14" x2="32" y2="14" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>

        <!-- 7. Whiskers -->
        <line x1="7" y1="17" x2="-3" y2="15" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7" y1="21" x2="-2" y2="23" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="17" x2="47" y2="15" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="21" x2="46" y2="23" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 8. Glowing Cyber Collar with medallion -->
        <path d="M 14 26 C 18 29 26 29 30 26" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="28.5" r="2.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
    </g>

    <g id="gun_group" transform="translate(108, 40) rotate(-90)">
        <path id="gun_1" d="M -7 -6 L 24 -6 L 26 -8 L 30 -8 L 30 8 L 26 8 L 24 6 L -7 6 Z" fill="#ef4444" stroke="#fbbf24" stroke-width="2"/>
        <circle id="shot_1" cx="30" cy="0" r="3" fill="#00f2fe"/>
        <circle id="axis_1" cx="0" cy="0" r="4" fill="#00f2fe"/>
    </g>
</svg>
